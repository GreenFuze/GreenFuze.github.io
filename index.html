<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="GreenFuze open-source software projects.">
  <title>GreenFuze</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; color: #eef7ff; background: radial-gradient(circle at top, #14334d, #07131f 62%); }
    main { width: min(680px, calc(100% - 40px)); padding: 48px; border: 1px solid #285274; border-radius: 22px; background: rgba(8, 25, 39, .86); box-shadow: 0 24px 70px rgba(0, 0, 0, .35); }
    h1 { margin: 0 0 10px; font-size: clamp(2.25rem, 8vw, 4rem); letter-spacing: -.04em; }
    p { color: #b9d0df; font-size: 1.1rem; line-height: 1.65; }
    a { display: inline-block; margin-top: 14px; padding: 12px 18px; border-radius: 10px; color: #06131d; background: #62d4ff; font-weight: 700; text-decoration: none; }
    a:hover { background: #91e2ff; }
  </style>
</head>
<body>
  <main>
    <h1>GreenFuze</h1>
    <p>Open-source software projects by GreenFuze.</p>
    <p>Cloud Storage for Playnite connects a Playnite library to user-selected cloud storage and helps install and manage games stored there.</p>
    <a href="/PlayniteCloudSource/">Cloud Storage for Playnite</a>
  </main>
</body>
</html>
